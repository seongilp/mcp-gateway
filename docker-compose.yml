# Bifrost MCP Gateway
#
# bifrost = 단일 엔드포인트 게이트웨이. 여러 MCP 서버를 뒤에 묶어
# 사내 클라이언트(Claude Code 등)에 하나의 주소로 노출한다.
#
# 구성:
#   - bifrost  : 게이트웨이 본체 (http://localhost:8080, 웹 UI 포함)
#   - toolbox  : BigQuery MCP 서버 (Google 공식 MCP Toolbox) — "예시" upstream
#
# MCP 서버 추가/교체는 data/config.json 의 mcp.client_configs 만 수정하면 된다.
# (자세한 건 README.md 참고)

services:
  bifrost:
    image: maximhq/bifrost:latest
    container_name: bifrost-gateway
    ports:
      - "8080:8080" # 게이트웨이 + 웹 UI
    volumes:
      - ./data:/app/data # config.json / config.db / logs.db 영속화
    environment:
      LOG_LEVEL: info
      LOG_STYLE: json
      # UI에서 저장하는 민감정보 암호화 키 (운영 시 .env로 주입)
      BIFROST_ENCRYPTION_KEY: ${BIFROST_ENCRYPTION_KEY:-}
    depends_on:
      - toolbox
    restart: unless-stopped

  # ── 예시 MCP 서버: BigQuery (Google 공식 MCP Toolbox for Databases) ──
  # 다른 DB/도구로 바꾸려면 이 서비스를 교체하고 config.json의 entry만 맞추면 된다.
  toolbox:
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:latest
    container_name: bigquery-mcp
    # --prebuilt bigquery : list_tables / execute_sql 등 기본 BigQuery 도구 제공
    # --address 0.0.0.0   : 컨테이너 외부(=bifrost)에서 접속 가능하게
    command: ["--prebuilt", "bigquery", "--address", "0.0.0.0", "--port", "5000"]
    expose:
      - "5000" # bifrost가 내부 네트워크로 http://toolbox:5000/mcp 접근
    # 디버깅용으로 호스트에서 직접 보고 싶으면 아래 주석 해제
    # ports:
    #   - "5000:5000"
    environment:
      # BigQuery 대상 프로젝트
      BIGQUERY_PROJECT: ${BIGQUERY_PROJECT:-}
      # 서비스 계정 키로 인증 (secrets/gcp-sa.json 마운트)
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
    volumes:
      - ./secrets:/secrets:ro
    restart: unless-stopped
